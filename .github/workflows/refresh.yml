name: Add a new discovery
on:
  schedule:
    - cron: '0 22 * * 0,2,4'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/update.test.mjs
      - run: node scripts/update.mjs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.OPENAI_MODEL }}
      - run: node scripts/check.mjs
      - name: Save validated content
        run: |
          git config user.name 'Curiosity Lab curator'
          git config user.email 'curator@users.noreply.github.com'
          git add dist/content.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add a source-checked discovery'
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
